<body>

    <!-- Ads Overlay -->
    <div id="adOverlay">
        <video id="adVideoElement" playsinline></video>
        <div id="adContainer"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="app-container" id="appContainer">
        <div class="app-background" id="appBackground"></div>

        <audio id="audioPlayer" crossorigin="anonymous" preload="auto" playsinline></audio>
        <audio id="previewAudio" preload="none" playsinline></audio>

        <header>
            <div style="width: 40px; position: absolute; left: 15px;"></div>
            <img id="headerLogo" src="https://media.tenor.com/Pq1cZiuhlEEAAAAi/rajinikanth.gif" alt="Logotipo da Rádio" class="logo-img">
            
            <!-- MENU DO HEADER (RECORD / SLEEP) -->
            <div class="header-right">
                <button class="header-menu-btn" id="headerMenuBtn"><i class="bi bi-three-dots-vertical"></i></button>
                <div class="header-dropdown" id="headerDropdown">
                    <button class="header-dropdown-btn" id="recordBtn" onclick="window.toggleRecording()"><i class="bi bi-record-circle"></i> Gravar Stream</button>
                    <button class="header-dropdown-btn" id="openSleepBtn" onclick="window.openSleepModal()"><i class="bi bi-moon-stars"></i> Sleep Timer</button>
                </div>
            </div>
        </header>

        <div class="view-container">
            <main id="homeView">
                <div class="hero-banner-art" id="homeCoverArt"></div>
                <div class="live-badge-green"><div class="dot-green"></div> AO VIVO</div>
                <div class="track-info-container">
                    <div class="title-wrapper"><h1 class="title" id="homeSongTitle">Conectando...</h1></div>
                    <div class="subtitle-wrapper"><p class="subtitle" id="homeSongArtist"><span>Aguarde</span></p></div>
                </div>
                <button class="play-btn-yellow" id="homePlayBtn">
                    <div class="loading-spinner" style="border-top-color: #000;"></div>
                    <span>OUVIR</span> <i class="bi bi-play-fill"></i>
                </button>
            </main>

            <main id="playerView">
                <div class="circular-art-wrapper">
                    <canvas id="visualizerCanvas" width="440" height="440"></canvas>
                    <div class="visualizer-ring" id="visualizerRing"></div>
                    <div class="circular-art" id="playerCoverArt">
                        <div class="share-overlay" id="shareOverlay" style="display: none;">
                            <button class="share-btn share-fb" id="shareFacebook" title="Compartilhar no Facebook"><i class="bi bi-facebook"></i></button>
                            <button class="share-btn share-tw" id="shareTwitter" title="Compartilhar no X"><i class="bi bi-twitter-x"></i></button>
                        </div>
                    </div>
                </div>

                <div class="track-info-container">
                    <div class="title-wrapper"><h1 class="title" id="playerSongTitle">Conectando...</h1></div>
                    <div class="subtitle-wrapper"><p class="subtitle" id="playerSongArtist"><span>Aguarde</span></p></div>
                </div>
                
                <div class="action-links">
                    <a href="#" target="_blank" class="action-btn" id="contactBtn" title="Fale conosco">
                        <i class="bi bi-whatsapp"></i> Contato
                    </a>
                    <button class="action-btn" id="openLyricsBtn" style="opacity: 0.4; pointer-events: none; cursor: not-allowed;"><i class="bi bi-music-note-list"></i> Letras</button>
                    <button class="action-btn" id="openStationsBtn"><i class="bi bi-boombox"></i> Estações</button>
                </div>
                
                <div class="main-player-controls-wrapper" id="mainPlayerControls">
                    
                    <div class="progress-container">
                        <div class="red-live-badge" id="playerLiveBadge" title="Sincronizar ao Vivo"><div class="dot-white"></div> AO VIVO</div>
                        <span id="dvrTimeDisplay" class="dvr-time-display">00:00</span>
                        <div class="progress-bar-track" id="playerProgressBar"></div>
                    </div>
                    
                    <div class="controls-row">
                        <i class="bi bi-volume-up control-icon" id="volumeToggleBtn" title="Mudo / Desmutar"></i>
                        
                        <i class="bi bi-skip-start-fill control-icon" id="prevStationBtn" title="Estação Anterior"></i>
                        <i class="bi bi-arrow-counterclockwise control-icon" title="Voltar 10s"></i>
                        
                        <button class="main-play-btn" id="playerPlayBtn">
                            <div class="loading-spinner"></div>
                            <i class="bi bi-play-fill" id="playerPlayIcon"></i>
                        </button>
                        
                        <i class="bi bi-arrow-clockwise control-icon" title="Avançar 10s"></i>
                        <i class="bi bi-skip-end-fill control-icon" id="nextStationBtn" title="Próxima Estação"></i>
                        
                        <div class="speed-wrapper" id="mainQualityBtn" onclick="window.openQualityModal()">
                            <i class="bi bi-speedometer2 control-icon"></i>
                            <div class="speed-badge" id="mainSpeedBadge"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <section class="history-section" id="historySection">
            <h2 class="history-title-header">Histórico de Músicas</h2>
            <div class="history-grid" id="historyGrid"></div>
        </section>

        <!-- Modais Principais -->
        <div class="stations-modal" id="stationsModal">
            <div class="modal-header">
                <h2>Selecione uma Estação</h2>
                <button class="close-modal-btn" id="closeStationsBtn">&times;</button>
            </div>
            <div class="stations-grid" id="stationsGrid"></div>
        </div>

        <div class="quality-modal" id="qualityModal">
            <div class="modal-header">
                <h2>Qualidade de Áudio</h2>
                <button class="close-modal-btn" id="closeQualityBtn">&times;</button>
            </div>
            <div class="quality-grid" id="qualityGrid"></div>
        </div>
        
        <div class="lyrics-modal" id="lyricsModal">
            <div class="modal-header">
                <h2>Letras da Música</h2>
                <button class="close-modal-btn" id="closeLyricsBtn">&times;</button>
            </div>
            <div class="lyrics-track-info" id="lyricsTrackInfo"></div>
            <div class="lyrics-content" id="lyricsContent"></div>
        </div>
        
        <!-- Modal Sleep Timer -->
        <div class="quality-modal" id="sleepModal">
            <div class="modal-header">
                <h2>Sleep Timer</h2>
                <button class="close-modal-btn" id="closeSleepBtn">&times;</button>
            </div>
            <div class="quality-grid">
                <div class="quality-option" onclick="window.setSleepTimer(15)">
                    <i class="bi bi-moon"></i><div class="quality-info"><div class="quality-title">15 Minutos</div></div>
                </div>
                <div class="quality-option" onclick="window.setSleepTimer(30)">
                    <i class="bi bi-moon"></i><div class="quality-info"><div class="quality-title">30 Minutos</div></div>
                </div>
                <div class="quality-option" onclick="window.setSleepTimer(60)">
                    <i class="bi bi-moon"></i><div class="quality-info"><div class="quality-title">1 Hora</div></div>
                </div>
                <div class="quality-option" onclick="window.setSleepTimer(0)">
                    <i class="bi bi-x-circle"></i><div class="quality-info"><div class="quality-title">Desativar</div></div>
                </div>
            </div>
        </div>

        <!-- Barra Sticky -->
        <div class="sticky-bottom-bar" id="stickyBottomBar">
            <i class="bi bi-volume-up control-icon" id="stickyVolumeBtn" title="Mudo / Desmutar"></i>
            
            <i class="bi bi-skip-start-fill control-icon" id="stickyPrevBtn" title="Estação Anterior"></i>
            <i class="bi bi-arrow-counterclockwise control-icon" title="Voltar 10s"></i>
            
            <button class="sticky-play-btn main-play-btn" id="stickyPlayBtn">
                <div class="loading-spinner"></div>
                <i class="bi bi-play-fill" id="stickyPlayIcon"></i>
            </button>
            
            <i class="bi bi-arrow-clockwise control-icon" title="Avançar 10s"></i>
            <i class="bi bi-skip-end-fill control-icon" id="stickyNextBtn" title="Próxima Estação"></i>
            
            <div class="sticky-mini-popup" id="stickyQualityPopup"></div>
            <div class="speed-wrapper" id="stickyQualityBtn">
                <i class="bi bi-speedometer2 control-icon"></i>
                <div class="speed-badge" id="stickySpeedBadge"></div>
            </div>
        </div>

    </div>

  
<script src="script.js" type="module"></script>
<script src="app.js"></script>
